name: PHP CI

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: make install
      - name: Env
        run: make env
      - name: Build assets
        run: make build
      - name: Lint
        run: make lint
      - name: Tests
        run: make test
